name: test

on:
  push:
    branches:
      - main

jobs:
  test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: test secret
        env:
          MY_SECRET: ${{ secrets.MY_REPO_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "the secret exists"

          else
            echo "the secret does not exist"
            exit 1
          fi
