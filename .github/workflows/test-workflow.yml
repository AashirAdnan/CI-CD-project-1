name: test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  repo-secrets:
    runs-on: ubuntu-latest
    env:
      MY_SECRET: ${{secrets.MY_REPO_SECRET}}
    steps:
      - name: this is a test
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "secret exists"
          else
            echo "secret doesnt exist"
            exit 1
          fi

      - name: this is another test
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "the string is empty"
          else
            echo "the string is not empty"
          fi

  env-secrets-vars:
    runs-on: ubuntu-latest
    environment: ENV_SECRET
    steps:
      - name: env secret
        env:
          MY_ENV_SECRET: ${{secrets.MY_ENV_SECRET}}
        run: |
          if [ -n "$MY_ENV_SECRET" ]; then
            echo "the secret exists"
          else
            echo "secret not found"
            exit 1
          fi

      - name: env vars
        env:
          MY_ENV_VAR: ${{vars.APP_PORT}}
        run: echo "this applications port is $MY_ENV_VAR"

  repo_vars:
    runs-on: ubuntu-latest
    steps:
      - name: repo variable
        env:
          MY_REPO_VAR: ${{vars.APP_NAME}}
        run: echo "${{vars.APP_NAME}}"
