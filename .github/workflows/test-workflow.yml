name: test

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_SECRET: ${{secrets.MY_SECRET_DOESNOT_EXIST}}
    steps:
      - name: this is a test
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "secret exists"
          else
            echo "secret doesnt exist"
            exit 1
          fi

      - name: this is another test
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "the string is empty"
          else
            echo "the string is not empty"
            exit 1
          fi
